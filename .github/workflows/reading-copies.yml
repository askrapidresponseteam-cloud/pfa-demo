# Reading copies of the library's PDFs, made on GitHub after a push.
#
# The reader opens resources/read/<slug>.pdf (scripts/build-reading-copies.py):
# the same pages with photographs sized for a screen, linearized, so a phone
# gets the first page in seconds instead of minutes. Together they are about
# 140 MB, too large to travel in the site's zip (owner, 7 Oct 2026: "need just
# 1 zip"), so they are built here instead, from the PDFs already in the
# repository, and committed back. Vercel then deploys that commit as it
# deploys any other.
#
# Runs when a library PDF, the catalogue, the builder or this file changes,
# and by hand from the Actions tab. Only missing copies are built, so a run
# with nothing to do changes nothing. Until a copy exists the reader opens
# the original PDF, so the site works throughout.

name: Reading copies

on:
  push:
    branches: [main]
    paths:
      - 'resources/*.pdf'
      - 'data/library.json'
      - 'scripts/build-reading-copies.py'
      - '.github/workflows/reading-copies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading-copies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools (poppler for outlined pages)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python libraries
        run: python -m pip install --quiet pikepdf pillow

      - name: Build the missing reading copies
        run: python scripts/build-reading-copies.py

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/read
          if git diff --cached --quiet; then
            echo "Every reading copy is already in the repository."
            exit 0
          fi
          git commit -m "Reading copies of the library's PDFs (built by GitHub Actions)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Could not push the reading copies"; exit 1
